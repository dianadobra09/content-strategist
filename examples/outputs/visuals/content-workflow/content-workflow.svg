<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
<title id="title">From raw notes to a reviewed post</title>
<desc id="desc">Diagram of the content workspace. The author's notes and artifacts inform a reader brief and evidence check. The draft and factual visual develop together. Humanizer and voice-check review them. The author approves and publishes. Their edits and observed results inform the next brief. This is a process diagram, not a claim of measured results. Source: CLAUDE.md and the skills in .claude/skills/.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#46685d"/></marker></defs>
<rect width="1080" height="1350" fill="#f5f3ee"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#1f302a">
<text x="80" y="66" font-size="22" letter-spacing="2" fill="#46685d">CONTENT WORKFLOW / SCHEMATIC</text>
<text x="80" y="127" font-size="46" font-weight="700">From raw notes</text>
<text x="80" y="181" font-size="46" font-weight="700">to a reviewed post</text>

<rect x="80" y="225" width="920" height="112" rx="8" fill="#e2ebe5" stroke="#c6cfc8" stroke-width="2"/>
<text x="108" y="268" font-size="32" font-weight="700">Your raw material</text>
<text x="108" y="308" font-size="29" fill="#46564f">Notes, opinions, code, photos and actual results</text>
<path d="M 540 337 V 378" fill="none" stroke="#46685d" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="80" y="382" width="920" height="112" rx="8" fill="#ffffff" stroke="#c6cfc8" stroke-width="2"/>
<text x="108" y="425" font-size="32" font-weight="700">A brief with evidence</text>
<text x="108" y="465" font-size="29" fill="#46564f">One reader situation, one useful point, clear limits</text>
<path d="M 540 494 V 520 H 300 V 551" fill="none" stroke="#46685d" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M 540 520 H 780 V 551" fill="none" stroke="#46685d" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="80" y="555" width="440" height="158" rx="8" fill="#ffffff" stroke="#c6cfc8" stroke-width="2"/>
<text x="108" y="598" font-size="32" font-weight="700">Draft the post</text>
<text x="108" y="638" font-size="29" fill="#46564f">Your words</text>
<text x="108" y="675" font-size="29" fill="#46564f">A fitting structure</text>
<rect x="560" y="555" width="440" height="158" rx="8" fill="#ffffff" stroke="#c6cfc8" stroke-width="2"/>
<text x="588" y="598" font-size="32" font-weight="700">Create the visual</text>
<text x="588" y="638" font-size="29" fill="#46564f">Real source material</text>
<text x="588" y="675" font-size="29" fill="#46564f">Editable + inspected</text>
<path d="M 300 713 V 742 H 540 V 772" fill="none" stroke="#46685d" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M 780 713 V 742 H 540" fill="none" stroke="#46685d" stroke-width="3"/>
<rect x="80" y="777" width="920" height="112" rx="8" fill="#ffffff" stroke="#c6cfc8" stroke-width="2"/>
<text x="108" y="820" font-size="32" font-weight="700">Check the text and visual</text>
<text x="108" y="860" font-size="29" fill="#46564f">Humanizer, then voice-check; fix unsupported claims</text>
<path d="M 540 889 V 930" fill="none" stroke="#46685d" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="80" y="934" width="920" height="112" rx="8" fill="#e2ebe5" stroke="#c6cfc8" stroke-width="2"/>
<text x="108" y="977" font-size="32" font-weight="700">You approve and publish</text>
<text x="108" y="1017" font-size="29" fill="#46564f">Your judgment is the final check</text>
<path d="M 540 1046 V 1087" fill="none" stroke="#46685d" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="80" y="1091" width="920" height="112" rx="8" fill="#ffffff" stroke="#c6cfc8" stroke-width="2"/>
<text x="108" y="1134" font-size="32" font-weight="700">Learn from edits and observed results</text>
<text x="108" y="1174" font-size="29" fill="#46564f">Keep useful patterns; do not change voice for reach</text>
<path d="M 1000 1147 H 1037 V 437 H 1005" fill="none" stroke="#46685d" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
<text x="80" y="1260" font-size="26" fill="#46685d">The dashed line feeds the next brief.</text>
<text x="80" y="1305" font-size="22" fill="#67756d">Source: the content workspace’s drafting, visual and review rules · Oct 2026</text>
</g></svg>